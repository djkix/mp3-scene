services:
  mp3-scene:
    image: ghcr.io/djkix/mp3-scene:latest   # ou une version précise : ghcr.io/djkix/mp3-scene:1.1.0
    container_name: mp3-scene
    restart: unless-stopped
    # durcissement : système de fichiers en lecture seule (sauf /data et /tmp), aucune capacité Linux, mémoire bornée
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    pids_limit: 256
    environment:
      SECRET_KEY: ${SECRET_KEY:?renseignez SECRET_KEY dans .env}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}   # inutile une fois le compte créé
      PUBLIC_URL: https://mp3.exemple.fr   # adresse publique HTTPS, sans slash final (URL envoyées au Chromecast)
      TZ: Europe/Paris                     # heure des journaux, du scan quotidien et de la sauvegarde
      # DISCOGS_TOKEN: ${DISCOGS_TOKEN}    # pochettes cherchées aussi sur Discogs (facultatif)
      # Dossiers de musique supplémentaires (facultatif) : « Nom=/chemin » séparés par « ; », montés plus bas
      # MUSIC_EXTRA: "05.Web Albums=/extra/albums;06.Fresh House=/extra/fresh"
      # Onglet Navidrome (facultatif) : valeurs dans .env
      # NAVIDROME_URL: ${NAVIDROME_URL:-}
      # NAVIDROME_USER: ${NAVIDROME_USER:-}
      # NAVIDROME_PASSWORD: ${NAVIDROME_PASSWORD:-}
      # Sauvegarde nocturne de la base (facultative) : décommentez avec les deux volumes plus bas.
      # BACKUP_DIR: /backup                # dossier des sauvegardes dans le conteneur
      # BACKUP_HOUR: "3"                   # heure à partir de laquelle la sauvegarde du jour est faite
    ports:
      # Le port ne doit être joignable QUE par le reverse proxy : l'appli fait confiance à son X-Forwarded-For.
      # Proxy sur la même machine : laisser 127.0.0.1. Proxy sur une autre machine : remplacer par l'adresse LAN
      # de cette machine ("192.168.1.20:8000:8000") et filtrer l'accès au pare-feu. Proxy dans un réseau Docker :
      # supprimer `ports` et rattacher les deux conteneurs au même réseau (le proxy joint mp3-scene:8000).
      - "127.0.0.1:8000:8000"
    volumes:
      - music:/music:ro        # lecture seule côté conteneur
      - ./data:/data           # base SQLite : à sauvegarder
      # - /chemin/vers/albums:/extra/albums:ro   # un par dossier de MUSIC_EXTRA, en lecture seule
      # - /chemin/vers/nas/mp3-scene:/backup   # un dossier daté par jour, sept gardés ; inscriptible par l'UID 1000
      # - .:/stack:ro                          # pour que la sauvegarde copie aussi ce fichier compose et le .env

volumes:
  music:
    driver: local
    driver_opts:
      type: nfs
      # lecture seule aussi côté montage ; « soft » : un NAS en panne donne des erreurs d'E/S gérées par
      # l'appli au lieu de bloquer indéfiniment les threads
      o: "addr=<IP_NAS>,ro,nfsvers=4,soft,timeo=150,retrans=3"
      device: ":/volume1/Releases"   # chemin de l'export NFS sur le NAS
